<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spiral Scroll • Rainbow Cylinder</title>
<style>
  html,body { height:100%; margin:0; background:#000; color:#cfd7ff; font:14px/1.4 system-ui,sans-serif;}
  /* Give us scroll room */
  main{ height:500vh; }
  #c{ position:fixed; inset:0; display:block; }
  #overlay{ position:fixed; inset:0; pointer-events:none; display:flex; justify-content:center; padding-top:10px;
            background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 35%); }
  h3{ margin:.2rem 0 0; text-align:center; font-weight:700; }
  p{ margin:.1rem 0 0; opacity:.75; text-align:center; }
  #popup-layer{ position:fixed; inset:0; display:flex; justify-content:center; align-items:center; pointer-events:none;
                opacity:0; transition:opacity .3s ease; }
  #popup-layer[data-visible="true"]{ opacity:1; }
  .popup-card{ --scale:0.8; --alpha:0;
               background:rgba(12,16,35,.9); border:1px solid rgba(207,215,255,.65); border-radius:16px;
               padding:1.4rem 1.6rem; width:min(280px,82vw); color:#eef1ff;
               box-shadow:0 18px 36px rgba(0,0,0,.45);
               transform:scale(var(--scale)); opacity:var(--alpha);
               transition:transform .24s ease, opacity .24s ease; pointer-events:auto; text-align:left; }
  .popup-card h4{ margin:0 0 .4rem; font-size:1.05rem; }
  .popup-card p{ margin:0; opacity:.88; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div>
    <h3>Scroll to spiral</h3>
    <p>One rainbow cylinder. Camera spirals around it as you scroll.</p>
  </div>
</div>
<div id="popup-layer">
  <div class="popup-card" data-visible="false">
    <h4></h4>
    <p></p>
  </div>
</div>
<main></main>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0.5, 8);

// lights
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 1);
dir.position.set(3,5,4);
scene.add(dir);

// rainbow texture (procedural)
function makeRainbowTexture(renderer){
  const w=1024, h=256, can=document.createElement('canvas');
  can.width=w; can.height=h;
  const ctx=can.getContext('2d');
  const g=ctx.createLinearGradient(0,0,w,0);
  [["#ff004c",0],["#ff7a00",.16],["#ffee00",.33],["#00d45a",.5],["#00b2ff",.66],["#7a3cff",.83],["#ff2bd6",1]]
    .forEach(([c,t])=>g.addColorStop(t,c));
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  const tex=new THREE.CanvasTexture(can);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(2,1);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy?.() ?? 1;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// --- Rainbow texture reused ---
const rainbowTex = makeRainbowTexture(renderer);
rainbowTex.wrapS = THREE.RepeatWrapping;
rainbowTex.wrapT = THREE.RepeatWrapping;
rainbowTex.repeat.set(2.0, 1.0);

// --- Puck params ---
const PUCK_RADIUS = 1.2;
const PUCK_HEIGHT = 0.55;     // thickness of each puck
const GAP        = 0.75;      // distance between puck centers (increase for larger gaps)
const COUNT      = 50;        // number of pucks to draw (make it big so it feels infinite)
const START_Y    = - (COUNT * GAP) / 2;
const HELIX_RADIUS = 1;     // distance from center axis for the corkscrew path
const HELIX_TURNS  = 3;       // full rotations from bottom to top

// Geometry/material (shared by all instances)
const puckGeo = new THREE.CylinderGeometry(PUCK_RADIUS, PUCK_RADIUS, PUCK_HEIGHT, 64, 1, false);
const puckMat = new THREE.MeshStandardMaterial({
  map: rainbowTex,
  metalness: 0.1,
  roughness: 0.35
});

// Instanced mesh
const pucks = new THREE.InstancedMesh(puckGeo, puckMat, COUNT);
pucks.instanceMatrix.setUsage(THREE.DynamicDrawUsage); // allow updates if needed
pucks.frustumCulled = false; // instances stretch far beyond the base geometry, so skip bounding-sphere culling
scene.add(pucks);

// Place pucks along Y
const m = new THREE.Matrix4();
const scratchPos = new THREE.Vector3();
const scratchQuat = new THREE.Quaternion();
const scratchScale = new THREE.Vector3(1,1,1);
const upAxis = new THREE.Vector3(0,1,0);
for (let i = 0; i < COUNT; i++) {
  const y = START_Y + i * GAP;
  const progress = i / COUNT;
  const angle = progress * HELIX_TURNS * Math.PI * 2;
  scratchPos.set(
    Math.cos(angle) * HELIX_RADIUS,
    y,
    Math.sin(angle) * HELIX_RADIUS
  );
  scratchQuat.setFromAxisAngle(upAxis, angle);
  m.compose(scratchPos, scratchQuat, scratchScale);
  pucks.setMatrixAt(i, m);
}
pucks.instanceMatrix.needsUpdate = true;

// subtle idle spin
const holder = new THREE.Group();
holder.add(pucks);
scene.add(holder);

// Popup checkpoints configuration
const popupLayer = document.getElementById('popup-layer');
const popupCard = popupLayer.querySelector('.popup-card');
const popupTitle = popupCard.querySelector('h4');
const popupBody = popupCard.querySelector('p');

const POPUPS = [
  { title: "Square One", body: "Checkpoint at the first third of the spiral." },
  { title: "Square Two", body: "Halfway through the corkscrew journey." },
  { title: "Square Three", body: "Final pause before the finish." }
];
const popupStops = POPUPS.map((_, idx) => (idx + 1) / (POPUPS.length + 1));
const POPUP_OVERSHOOT = 0.08;

let rawScrollProgress = 0;
let lockedStop = null;
let activePopup = -1;
let completedPopup = -1;
let tTarget = 0;
let t = 0;

function showPopup(index){
  const data = POPUPS[index];
  popupTitle.textContent = data.title;
  popupBody.textContent = data.body;
  popupLayer.dataset.visible = "true";
  popupCard.dataset.visible = "true";
  popupCard.style.setProperty('--scale', '0.8');
  popupCard.style.setProperty('--alpha', '0');
  requestAnimationFrame(()=> setPopupProgress(0));
}

function hidePopup(){
  popupCard.dataset.visible = "false";
  popupLayer.dataset.visible = "false";
  popupCard.style.setProperty('--alpha', '0');
}

function setPopupProgress(value){
  const clamped = Math.min(Math.max(value, 0), 1);
  const scale = 1 - clamped * 0.55;
  const alpha = 1 - clamped * 0.45;
  popupCard.style.setProperty('--scale', scale.toFixed(3));
  popupCard.style.setProperty('--alpha', alpha.toFixed(3));
}

// spiral params
const radius = 8;
const turns  = 6;
const yStart = -2;
const yEnd   =  2;
const tilt   = 0.12;

// track scroll progress 0..1 (no GSAP)
function pageProgress(){
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}

function handleScroll(){
  rawScrollProgress = pageProgress();

  if (lockedStop !== null){
    const overshoot = rawScrollProgress - lockedStop;
    if (overshoot >= POPUP_OVERSHOOT){
      setPopupProgress(1);
      hidePopup();
      completedPopup = activePopup;
      lockedStop = null;
      activePopup = -1;
      tTarget = rawScrollProgress;
      handleScroll();
      return;
    } else if (overshoot <= -POPUP_OVERSHOOT){
      setPopupProgress(0);
      hidePopup();
      completedPopup = Math.max(-1, activePopup - 1);
      lockedStop = null;
      activePopup = -1;
      tTarget = rawScrollProgress;
    } else {
      setPopupProgress(Math.max(0, overshoot / POPUP_OVERSHOOT));
      tTarget = lockedStop;
    }
    return;
  }

  const nextIndex = completedPopup + 1;
  if (nextIndex < POPUPS.length && rawScrollProgress >= popupStops[nextIndex]){
    activePopup = nextIndex;
    lockedStop = popupStops[nextIndex];
    showPopup(nextIndex);
    setPopupProgress(0);
    tTarget = lockedStop;
    return;
  }

  tTarget = rawScrollProgress;
}

addEventListener('scroll', handleScroll, {passive:true});
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  handleScroll();
});

handleScroll();
t = tTarget;

// render loop
let last = performance.now();
function tick(now=performance.now()){
  const dt = Math.min((now-last)/1000, 0.033); last = now;

  // ease towards scroll target for smoothness
  t += (tTarget - t) * Math.min(1, dt*6);

  holder.rotation.y += 0.1 * dt;

  const angle = t * turns * Math.PI * 2;
  const y = THREE.MathUtils.lerp(yStart, yEnd, t);
  const bank = Math.sin(angle) * tilt;

  camera.position.set(
    Math.sin(angle) * radius,
    y + bank,
    Math.cos(angle) * radius
  );
  const ahead = angle + 0.02;
  camera.lookAt(
    Math.sin(ahead)*0.5,
    y,
    Math.cos(ahead)*0.5
  );

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
