<!doctype html>
<html>
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head>
<body style="margin:0;height:400vh;background:#000">
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";
import { gsap } from "https://cdn.skypack.dev/gsap@3";
import ScrollTrigger from "https://cdn.skypack.dev/gsap@3/ScrollTrigger";
gsap.registerPlugin(ScrollTrigger);

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight); window.addEventListener("resize",()=>renderer.setSize(innerWidth,innerHeight));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
const light = new THREE.DirectionalLight(0xffffff, 1); light.position.set(5,5,5); scene.add(light);

const geo = new THREE.PlaneGeometry(1, 0.6);
const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
for (let i=0;i<12;i++){ const m=new THREE.Mesh(geo, mat.clone());
  m.position.set(Math.sin(i*0.5)*2, i*0.7-3, Math.cos(i*0.5)*2); scene.add(m);
}

const pts = []; for (let i=0;i<200;i++){ const t=i/199, a=t*Math.PI*3;
  pts.push(new THREE.Vector3(Math.sin(a)*2, t*8-2, Math.cos(a)*2)); // helix “spine”
}
const curve = new THREE.CatmullRomCurve3(pts);
const pathGeo = new THREE.TubeGeometry(curve, 400, 0.02, 8, false);
scene.add(new THREE.Mesh(pathGeo, new THREE.MeshBasicMaterial({ color: 0x4444ff, wireframe:true })));

let t = 0;
gsap.to({}, {
  scrollTrigger: { trigger: document.body, start: 0, end: "400vh", scrub: true },
  onUpdate: self => { t = self.progress; }
});

function tick(){
  const p = curve.getPointAt(t), q = curve.getPointAt(Math.min(t+0.002,1));
  camera.position.copy(p);
  camera.lookAt(q);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
