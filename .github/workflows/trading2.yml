name: trading2 mop-up book

# Runs the Strategy-1 paper account on GitHub's servers (no local machine needed):
# scan favorites -> settle resolved positions -> redeploy idle cash -> commit book.json.
#
# PAGES-QUOTA BATCHING: every push to this repo triggers a GitHub Pages deploy
# ([skip ci] does NOT skip Pages), and Pages soft-limits ~10 deploys/hour for the
# whole repo — shared with manual dashboard pushes. So this workflow (a) runs
# every 3h instead of hourly and (b) commits only on a MEANINGFUL book change
# (cash moved / position opened or settled), not on mark-to-market churn, which
# used to change book.json every single run.
on:
  schedule:
    - cron: "17 */3 * * *"    # every 3h (UTC; GitHub may delay under load)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write             # needed to commit book.json back to the repo

concurrency:
  group: trading2-book
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mop-up book
        run: python3 trading2/run.py
      - name: Commit updated book (only on meaningful change)
        run: |
          git config user.name  "trading2-bot"
          git config user.email "actions@users.noreply.github.com"
          # signature = cash + settle count + position set; `cur` marks and
          # `updated` churn every run and aren't worth a Pages deploy
          SIG='import json,sys;b=json.load(sys.stdin);print(round(b["cash"],2),len(b["history"]),sorted(p["cid"] for p in b["positions"]))'
          NEW=$(python3 -c "$SIG" < trading2/book.json)
          OLD=$(git show HEAD:trading2/book.json | python3 -c "$SIG" 2>/dev/null || echo none)
          if [ "$NEW" != "$OLD" ]; then
            git add trading2/book.json
            git commit -m "trading2: update mop-up book [skip ci]"
            git push
          else
            echo "marks-only change — skipped push (saving Pages deploy quota)"
          fi
